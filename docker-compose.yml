version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: scrapoo-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgres://scrapoo:scrapoo@postgres:5432/scrapoo
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCRAPY_SETTINGS_MODULE: crawler.settings
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: scrapoo-worker
    environment:
      DATABASE_URL: postgres://scrapoo:scrapoo@postgres:5432/scrapoo
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SCRAPY_SETTINGS_MODULE: crawler.settings
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: scrapoo-postgres
    environment:
      POSTGRES_USER: scrapoo
      POSTGRES_PASSWORD: scrapoo
      POSTGRES_DB: scrapoo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: scrapoo-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
